model_path: models/base-user-simulator-model
train_file: data/sft_train.jsonl
eval_file: data/sft_eval.jsonl
output_dir: outputs/sft
seed: 42
max_length: 2048
learning_rate: 0.0001
num_train_epochs: 2
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16
warmup_ratio: 0.03
weight_decay: 0.01
logging_steps: 5
eval_steps: 100
save_steps: 100
save_total_limit: 2
bf16: true
gradient_checkpointing: true
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
